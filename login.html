<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Averion</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container-fluid m-0 p-0 position-relative overflow-hidden">
      <section class="auth-screen d-flex flex-column flex-md-row">
        <div class="il-sect position-relative h-100 p-4">
          <div
            class="position-absolute top-50 start-50 translate-middle d-flex flex-column gap-4 align-items-center justify-content-center"
          >
            <div class="logo-cont d-flex align-items-center gap-2 m-auto">
              <img src="assets/img/logo-white.png" alt="" class="logo" />
              <h1 class="fs-5 m-0 text" style="font-family: 'Inter'">
                Averion
              </h1>
            </div>

            <img
              src="assets/img/login-pg-ill.png"
              alt=""
              class="illustration"
            />
          </div>
        </div>

        <div class="auth-sect position-relative h-100 pt-4 pt-md-5">
          <div class="auth-form-container auth-sub-sect pb-5">
            <div class="section-text-box">
              <h2 class="heading">Sign In</h2>
              <p class="subtext">
                Welcome back! Log in to shop your favorites, sell with ease, and
                connect with the Averion community.
              </p>
            </div>
            <form class="auth-form login-form d-flex flex-column gap-3">
              <div class="form-group w-100">
                <label for="">Email *</label>
                <input
                  type="email"
                  class="form-control w-100"
                  placeholder="Email"
                />
              </div>
              <div class="form-group w-100">
                <label for="">Password *</label>
                <input
                  type="password"
                  class="form-control w-100"
                  placeholder="Enter your password"
                />
              </div>

              <a
                href="forgot-password.html"
                type="button"
                class="p-0 forgot-pass-link text-decoration-none"
                >Forgot Password</a
              >

              <div class="btn-group d-flex flex-column gap-2 mt-3">
                <button type="submit" class="submit-btn px-5 w-100">
                  Log In
                </button>

                <a href="register.html" class="text-decoration-none">
                  <button
                    type="button"
                    class="px-5 w-100 alt-btn create-acc-btn"
                  >
                    Create account
                  </button>
                </a>
              </div>
            </form>
          </div>

          <!-- FOOTER -->
          <footer class="section-container auth-footer m-0 mt-3">
            <div class="inner">
              <p class="copyright text-center m-0">
                &copy; 2025 Averion, All Rights Reserved
              </p>
            </div>
          </footer>
        </div>
      </section>
      <!-- End of Login Section -->
    </div>

    <!-- Bootstrap CDN Bundle JS (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery CDN-->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Custom JS File-->
    <script src="script.js"></script>
  </body>
</html>
