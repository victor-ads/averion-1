<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Add Product - Auto Marketplace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #F6F6FF;
            overflow-x: hidden;
        }

        /* Layout */
        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 242px;
            background: white;
            border-right: 1px solid #F3F3FE;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar-content {
            padding: 32px 16px;
        }

        .logo {
            margin-bottom: 48px;
            padding: 0 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin: 4px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: #333333;
            font-size: 14px;
        }

        .nav-item:hover {
            background: #F5F5F5;
        }

        .nav-item.active {
            background: #EFF3FF;
            color: #1A52F1;
            font-weight: 600;
        }

        .nav-item.active svg path {
            fill: #1A52F1;
        }

        .logout-section {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid #F3F3FE;
        }

        /* Mobile Header */
        .mobile-header {
            background: white;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 99;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: none;
        }

        .mobile-menu-btn {
            cursor: pointer;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 99;
            display: none;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 242px;
            padding: 24px 32px;
        }

        /* Header */
        .header {
            background: white;
            padding: 20px 32px;
            border-radius: 4px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0px 0px 30px rgba(41, 41, 204, 0.05);
        }

        .page-title {
            font-size: 20px;
            font-weight: 700;
            color: black;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: #D9D9D9;
            border-radius: 50%;
        }

        /* Form Container */
        .form-container {
            background: white;
            border-radius: 4px;
            padding: 32px;
            box-shadow: 0px 0px 30px rgba(41, 41, 204, 0.05);
        }

        .form-section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: black;
            margin-bottom: 24px;
        }

        /* Form Grid */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-bottom: 24px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-field label {
            font-size: 14px;
            font-weight: 500;
            color: #333333;
        }

        .form-field input,
        .form-field select,
        .form-field textarea {
            padding: 12px 16px;
            border: 1px solid #A8ADBD;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-field input:focus,
        .form-field select:focus,
        .form-field textarea:focus {
            outline: none;
            border-color: #1A52F1;
            box-shadow: 0 0 0 2px rgba(26, 82, 241, 0.1);
        }

        /* Image Upload */
        .image-upload-area {
            border: 1px dashed #2929CC;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #F9FAFB;
        }

        .image-upload-area:hover {
            background: #F3F4F6;
            border-color: #1A52F1;
        }

        .upload-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 12px;
        }

        .upload-text {
            color: #2929CC;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .upload-hint {
            color: #6C707E;
            font-size: 12px;
        }

        .image-preview {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .preview-item {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remove-image {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin-top: 32px;
        }

        .btn {
            padding: 12px 32px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-family: inherit;
        }

        .btn-outline {
            background: white;
            border: 1px solid #1A52F1;
            color: #1A52F1;
        }

        .btn-outline:hover {
            background: #1A52F1;
            color: white;
        }

        .btn-primary {
            background: #1A52F1;
            color: white;
        }

        .btn-primary:hover {
            background: #0E3FC7;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26, 82, 241, 0.3);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }

        .toast.success {
            background: #10B981;
        }

        .toast.error {
            background: #EF4444;
        }

        .toast.info {
            background: #3B82F6;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Success Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .success-modal {
            background: white;
            border-radius: 10px;
            width: 90%;
            max-width: 697px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0px 0px 10px rgba(51, 51, 51, 0.12);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .success-modal {
            transform: scale(1);
        }

        .success-icon {
            position: relative;
            width: 93px;
            height: 93px;
            margin: 0 auto 32px;
        }

        .success-circle-outer {
            width: 93px;
            height: 93px;
            border-radius: 50%;
            border: 3px solid #0AAD1A;
            position: absolute;
            top: 0;
            left: 0;
        }

        .success-circle-inner {
            width: 73px;
            height: 73px;
            background: #0AAD1A;
            border-radius: 50%;
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-tick {
            width: 43px;
            height: 43px;
        }

        .success-title {
            font-size: 24px;
            font-weight: 600;
            color: #1B1C1E;
            margin-bottom: 32px;
            line-height: 1.3;
        }

        .modal-buttons {
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .modal-btn {
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-family: inherit;
            min-width: 160px;
        }

        .modal-btn-outline {
            background: white;
            border: 1px solid #1A52F1;
            color: #1A52F1;
        }

        .modal-btn-outline:hover {
            background: #1A52F1;
            color: white;
        }

        .modal-btn-primary {
            background: #1A52F1;
            color: white;
        }

        .modal-btn-primary:hover {
            background: #0E3FC7;
            transform: translateY(-1px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .mobile-header {
                display: flex;
            }
            
            .sidebar {
                transform: translateX(-100%);
            }
            
            .sidebar.open {
                transform: translateX(0);
            }
            
            .main-content {
                margin-left: 0;
                padding: 80px 16px 24px 16px;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .header {
                display: none;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
            
            .success-modal {
                padding: 32px 20px;
                width: 95%;
            }
            
            .success-title {
                font-size: 20px;
            }
            
            .modal-buttons {
                flex-direction: column;
                gap: 16px;
            }
            
            .modal-btn {
                width: 100%;
            }
        }

        @media (min-width: 769px) {
            .mobile-header {
                display: none;
            }
        }
    </style>
</head>

                                <select id="negotiable">
                                    <option value="yes">Yes</option>
                                    <option value="no">No</option>
                                </select>
                            </div>
                            <div class="form-field">
                                <label>Condition *</label>
                                <select id="condition" required>
                                    <option value="brand_new">Brand New</option>
                                    <option value="like_new">Like New</option>
                                    <option value="used">Used</option>
                                </select>
                            </div>
                            <div class="form-field">
                                <label>Location *</label>
                                <input type="text" id="location" placeholder="City, State" value="Lekki, Lagos" required>
                            </div>
                        </div>
                    </div>

                    <!-- Specifications Section -->
                    <div class="form-section">
                        <h2 class="section-title">Specifications</h2>
                        <div class="form-grid">
                            <div class="form-field">
                                <label>Engine</label>
                                <input type="text" id="engine" placeholder="e.g., V6, 3.5L">
                            </div>
                            <div class="form-field">
                                <label>Acceleration</label>
                                <input type="text" id="acceleration" placeholder="e.g., 0-100 km/h in 6.5s">
                            </div>
                            <div class="form-field">
                                <label>Top Speed</label>
                                <input type="text" id="topSpeed" placeholder="e.g., 250 km/h">
                            </div>
                            <div class="form-field">
                                <label>Transmission</label>
                                <select id="transmission">
                                    <option value="">Select transmission</option>
                                    <option value="automatic">Automatic</option>
                                    <option value="manual">Manual</option>
                                </select>
                            </div>
                            <div class="form-field">
                                <label>Fuel Economy</label>
                                <input type="text" id="fuelEconomy" placeholder="e.g., 15 km/L">
                            </div>
                            <div class="form-field">
                                <label>Body Style</label>
                                <select id="bodyStyle">
                                    <option value="sedan">Sedan</option>
                                    <option value="suv">SUV</option>
                                    <option value="hatchback">Hatchback</option>
                                </select>
                            </div>
                            <div class="form-field">
                                <label>Color</label>
                                <input type="text" id="color" placeholder="e.g., Black, White">
                            </div>
                            <div class="form-field">
                                <label>Brand</label>
                                <select id="brand">
                                    <option value="mercedes">Mercedes</option>
                                    <option value="bmw">BMW</option>
                                    <option value="audi">Audi</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="button-group">
                        <button type="button" class="btn btn-outline" id="saveDraftBtn">Save Draft</button>
                        <button type="submit" class="btn btn-primary">Publish</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Success Modal -->
    <div class="modal-overlay" id="successModal">
        <div class="success-modal">
            <div class="success-icon">
                <div class="success-circle-outer"></div>
                <div class="success-circle-inner">
                    <svg class="success-tick" viewBox="0 0 43 43" fill="none">
                        <path d="M37.3476 12.3053L15.9331 33.7197L6.11816 23.9048L8.63436 21.3886L15.9331 28.6695L34.8314 9.78906L37.3476 12.3053Z" fill="white"/>
                    </svg>
                </div>
            </div>
            <h2 class="success-title">Product Published Successfully!</h2>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-outline" id="addNewProductBtn">Add New Product</button>
                <button class="modal-btn modal-btn-primary" id="goToManageBtn">Go to Manage Product</button>
            </div>
        </div>
    </div>

    <script>
        // Image Upload Functionality
        const imageUploadArea = document.getElementById('imageUploadArea');
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        let uploadedImages = [];

        imageUploadArea.addEventListener('click', () => {
            imageInput.click();
        });

        imageInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            
            files.forEach(file => {
                if (file.size > 5 * 1024 * 1024) {
                    showToast('File too large! Max 5MB', 'error');
                    return;
                }
                
                if (!file.type.match('image.*')) {
                    showToast('Please upload only image files', 'error');
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    uploadedImages.push({
                        id: Date.now() + Math.random(),
                        src: event.target.result,
                        file: file
                    });
                    renderImagePreviews();
                };
                reader.readAsDataURL(file);
            });
        });

        function renderImagePreviews() {
            imagePreview.innerHTML = uploadedImages.map(img => `
                <div class="preview-item">
                    <img src="${img.src}" alt="Product image">
                    <button class="remove-image" onclick="removeImage('${img.id}')">×</button>
                </div>
            `).join('');
        }

        window.removeImage = (id) => {
            uploadedImages = uploadedImages.filter(img => img.id != id);
            renderImagePreviews();
        };

        // Form Validation
        function validateForm() {
            const productName = document.getElementById('productName').value.trim();
            const category = document.getElementById('category').value;
            const price = document.getElementById('price').value;
            const condition = document.getElementById('condition').value;
            const location = document.getElementById('location').value.trim();

            if (!productName) {
                showToast('Please enter product name', 'error');
                return false;
            }
            
            if (!category) {
                showToast('Please select a category', 'error');
                return false;
            }
            
            if (!price || price <= 0) {
                showToast('Please enter a valid price', 'error');
                return false;
            }
            
            if (!condition) {
                showToast('Please select condition', 'error');
                return false;
            }
            
            if (!location) {
                showToast('Please enter location', 'error');
                return false;
            }
            
            if (uploadedImages.length === 0) {
                showToast('Please upload at least one product image', 'error');
                return false;
            }
            
            return true;
        }

        // Get form data
        function getFormData() {
            return {
                productName: document.getElementById('productName').value.trim(),
                category: document.getElementById('category').value,
                price: parseFloat(document.getElementById('price').value),
                negotiable: document.getElementById('negotiable').value,
                condition: document.getElementById('condition').value,
                location: document.getElementById('location').value.trim(),
                engine: document.getElementById('engine').value,
                acceleration: document.getElementById('acceleration').value,
                topSpeed: document.getElementById('topSpeed').value,
                transmission: document.getElementById('transmission').value,
                fuelEconomy: document.getElementById('fuelEconomy').value,
                bodyStyle: document.getElementById('bodyStyle').value,
                color: document.getElementById('color').value,
                brand: document.getElementById('brand').value,
                images: uploadedImages.map(img => img.file),
                createdAt: new Date().toISOString()
            };
        }

        // Save to localStorage (for drafts)
        function saveToLocalStorage(data, isDraft = true) {
            const key = isDraft ? 'productDraft' : 'publishedProducts';
            let existing = JSON.parse(localStorage.getItem(key) || '[]');
            
            if (isDraft) {
                existing = [data];
            } else {
                existing.push(data);
            }
            
            localStorage.setItem(key, JSON.stringify(existing));
        }

        // Show modal
        function showSuccessModal() {
            const modal = document.getElementById('successModal');
            modal.classList.add('active');
        }

        function hideSuccessModal() {
            const modal = document.getElementById('successModal');
            modal.classList.remove('active');
        }

        // Show toast notification
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Reset form
        function resetForm() {
            document.getElementById('productForm').reset();
            uploadedImages = [];
            renderImagePreviews();
            document.getElementById('location').value = 'Lekki, Lagos';
        }

        // Save draft functionality
        document.getElementById('saveDraftBtn').addEventListener('click', () => {
            if (!validateForm()) return;
            
            const formData = getFormData();
            formData.status = 'draft';
            saveToLocalStorage(formData, true);
            
            showToast('Draft saved successfully!', 'success');
            console.log('Saved draft:', formData);
        });

        // Publish functionality
        document.getElementById('productForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            if (!validateForm()) return;
            
            const formData = getFormData();
            formData.status = 'published';
            saveToLocalStorage(formData, false);
            
            // Show success modal instead of toast
            showSuccessModal();
            console.log('Published product:', formData);
        });

        // Modal button handlers
        document.getElementById('addNewProductBtn').addEventListener('click', () => {
            hideSuccessModal();
            resetForm();
            showToast('Ready to add another product!', 'success');
        });

        document.getElementById('goToManageBtn').addEventListener('click', () => {
            hideSuccessModal();
            showToast('Redirecting to manage products...', 'info');
            // Add actual navigation logic here
        });

        // Close modal when clicking outside
        document.getElementById('successModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('successModal')) {
                hideSuccessModal();
            }
        });

        // Navigation functionality
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                const page = item.dataset.page;
                if (page === 'overview') {
                    showToast('Overview page coming soon!', 'info');
                } else if (page === 'manage-products') {
                    showToast('Manage products page coming soon!', 'info');
                } else if (page === 'messages') {
                    showToast('Messages page coming soon!', 'info');
                } else if (page === 'settings') {
                    showToast('Settings page coming soon!', 'info');
                }
            });
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Are you sure you want to log out?')) {
                showToast('Logged out successfully!', 'success');
            }
        });

        // Mobile menu
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        if (mobileMenuBtn) {
            mobileMenuBtn.addEventListener('click', () => {
                sidebar.classList.add('open');
                sidebarOverlay.style.display = 'block';
            });
        }

        sidebarOverlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            sidebarOverlay.style.display = 'none';
        });

        // Load draft if exists
        function loadDraft() {
            const draft = JSON.parse(localStorage.getItem('productDraft') || '[]');
            if (draft.length > 0 && confirm('You have a saved draft. Load it?')) {
                const data = draft[0];
                document.getElementById('productName').value = data.productName || '';
                document.getElementById('category').value = data.category || '';
                document.getElementById('price').value = data.price || '';
                document.getElementById('negotiable').value = data.negotiable || 'yes';
                document.getElementById('condition').value = data.condition || '';
                document.getElementById('location').value = data.location || 'Lekki, Lagos';
                document.getElementById('engine').value = data.engine || '';
                document.getElementById('acceleration').value = data.acceleration || '';
                document.getElementById('topSpeed').value = data.topSpeed || '';
                document.getElementById('transmission').value = data.transmission || '';
                document.getElementById('fuelEconomy').value = data.fuelEconomy || '';
                document.getElementById('bodyStyle').value = data.bodyStyle || '';
                document.getElementById('color').value = data.color || '';
                document.getElementById('brand').value = data.brand || '';
                showToast('Draft loaded successfully!', 'success');
            }
        }

        // Initialize
        loadDraft();
    </script>
</body>
</html>
